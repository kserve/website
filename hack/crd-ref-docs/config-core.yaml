processor:
  # RE2 regular expressions describing types that should be excluded from the generated documentation.
  # ignoreTypes:
  # -
  # RE2 regular expressions describing type fields that should be excluded from the generated documentation.
  ignoreFields:
    - "TypeMeta$"
  customMarkers:
    - name: "notImplementedHide"
      target: "field"

render:
  # Version of Kubernetes to use when generating links to Kubernetes API documentation.
  kubernetesVersion: 1.31
  # Field types from outside pkg/apis/serving get no section on the page, yet crd-ref-docs
  # links them to one (#addressable). Covers what release-0.16 through master reference.
  knownTypes:
    - name: Addressable
      package: knative.dev/pkg/apis/duck/v1
      link: https://pkg.go.dev/knative.dev/pkg/apis/duck/v1#Addressable
    - name: Conditions
      package: knative.dev/pkg/apis/duck/v1
      link: https://pkg.go.dev/knative.dev/pkg/apis/duck/v1#Conditions
    - name: URL
      package: knative.dev/pkg/apis
      link: https://pkg.go.dev/knative.dev/pkg/apis#URL
    - name: TrafficTarget
      package: knative.dev/serving/pkg/apis/serving/v1
      link: https://pkg.go.dev/knative.dev/serving/pkg/apis/serving/v1#TrafficTarget
    - name: BackendObjectReference
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://pkg.go.dev/sigs.k8s.io/gateway-api/apis/v1#BackendObjectReference
    - name: Group
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://pkg.go.dev/sigs.k8s.io/gateway-api/apis/v1#Group
    - name: HTTPRouteSpec
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://pkg.go.dev/sigs.k8s.io/gateway-api/apis/v1#HTTPRouteSpec
    - name: Kind
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://pkg.go.dev/sigs.k8s.io/gateway-api/apis/v1#Kind
    - name: Namespace
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://pkg.go.dev/sigs.k8s.io/gateway-api/apis/v1#Namespace
    - name: ObjectName
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://pkg.go.dev/sigs.k8s.io/gateway-api/apis/v1#ObjectName
    - name: ObjectReference
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://pkg.go.dev/sigs.k8s.io/gateway-api/apis/v1#ObjectReference
