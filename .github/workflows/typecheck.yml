name: Typecheck

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.x
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm run typecheck
